# HTTP-context configuration, loaded from conf.d. Apply the limit only inside
# hub.picare.vn's HTTPS server; other applications retain their own policies.
map $uri $picare_hub_asset_key {
    default "";
    ~^/(assets|protected)/ "$server_name:$binary_remote_addr";
}
limit_req_zone $picare_hub_asset_key zone=picare_hub_assets:10m rate=10r/s;

log_format picare_hub_delivery escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"host":"$host","method":"$request_method","path":"$uri",'
    '"status":$status,"bytes":$body_bytes_sent,"rate_limit":"$limit_req_status",'
    '"audit_id":"$upstream_http_x_ui_audit"}';
