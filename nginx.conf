server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Validate the existing .picare.vn session with Core, not cookie presence,
    # User-Agent or Referer. This endpoint is never publicly accessible.
    location = /_private_ui_auth {
        internal;
        proxy_pass https://core.picare.vn/api/v1/users/me;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Host core.picare.vn;
        proxy_set_header Cookie $http_cookie;
        proxy_ssl_server_name on;
        proxy_ssl_name core.picare.vn;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache off;
    }

    location = /pimory {
        auth_request /_private_ui_auth;
        error_page 401 = @pimory_login;
        error_page 500 502 503 504 = @private_ui_unavailable;
        add_header Cache-Control "private, no-store" always;
        add_header Vary Cookie always;
        try_files /index.html =404;
    }

    location = /pimory/ {
        return 308 /pimory$is_args$args;
    }

    location @pimory_login {
        add_header Cache-Control "private, no-store" always;
        return 302 /login?redirect=%2Fpimory;
    }

    # Valid catalogue IDs/gallery names contain no query delimiters. Build the
    # encoded login return path before auth subrequests can change captures.
    location ~ "^/catalogue/public/(?<catalogue_route>[A-Za-z0-9-]+)/?$" {
        set $catalogue_login_redirect /login?redirect=%2Fcatalogue%2Fpublic%2F$catalogue_route;
        auth_request /_private_ui_auth;
        error_page 401 = @catalogue_login;
        error_page 500 502 503 504 = @private_ui_unavailable;
        add_header Cache-Control "private, no-store" always;
        add_header Vary Cookie always;
        try_files /index.html =404;
    }

    location @catalogue_login {
        add_header Cache-Control "private, no-store" always;
        return 302 $catalogue_login_redirect;
    }

    location @private_ui_unavailable {
        add_header Cache-Control "private, no-store" always;
        default_type text/plain;
        return 503 "Service temporarily unavailable. Please try again later.";
    }

    # ^~ takes priority over the public immutable-asset regex below.
    # Even a known filename requires a live server-validated session.
    location ^~ /protected/ {
        auth_request /_private_ui_auth;
        error_page 500 502 503 504 = @private_ui_unavailable;
        add_header Cache-Control "private, no-store" always;
        add_header Vary Cookie always;
        try_files $uri =404;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|mp3|wav)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
