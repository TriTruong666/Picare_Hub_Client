server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Every private file is authorized against Core by the internal UI service.
    location = /_private_ui_auth {
        internal;
        proxy_pass http://hub-ui-access:8080/authorize;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }
    auth_request_set $ui_actor $upstream_http_x_ui_actor;
    auth_request_set $ui_audit $upstream_http_x_ui_audit;
    auth_request_set $ui_limited $upstream_http_x_ui_limited;
    auth_request_set $ui_login_redirect $upstream_http_x_ui_login;

    # This endpoint exposes only the current account's audit reference.
    location = /__ui/session {
        proxy_pass http://hub-ui-access:8080/session;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "private, no-store" always;
    }
    location = /__ui/event {
        client_max_body_size 2k;
        proxy_pass http://hub-ui-access:8080/event;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "private, no-store" always;
    }
    location = /__ui/authorize { return 404; }

    location @private_ui_denied {
        add_header Cache-Control "private, no-store" always;
        add_header Retry-After "60" always;
        if ($ui_limited = "1") { return 429; }
        return 403;
    }

    # Internal dashboards and authenticated tools share one delivery boundary.
    location ~ "^/(?:dashboard(?:/.*)?|contracts/(?:create|[^/]+/(?:edit|preview))/?|catalogue/(?:create|[^/]+/edit)/?|qr-products/(?:generator|[^/]+/edit)/?)$" {
        auth_request /_private_ui_auth;
        add_header X-Ui-Audit $ui_audit always;
        error_page 401 = @dashboard_login;
        error_page 403 = @private_ui_denied;
        error_page 500 502 503 504 = @private_ui_unavailable;
        add_header Cache-Control "private, no-store" always;
        add_header Vary Cookie always;
        try_files /index.html =404;
    }
    location @dashboard_login {
        add_header Cache-Control "private, no-store" always;
        return 302 $ui_login_redirect;
    }

    location = /pimory {
        auth_request /_private_ui_auth;
        add_header X-Ui-Audit $ui_audit always;
        error_page 401 = @pimory_login;
        error_page 403 = @private_ui_denied;
        error_page 500 502 503 504 = @private_ui_unavailable;
        add_header Cache-Control "private, no-store" always;
        add_header Vary Cookie always;
        try_files /index.html =404;
    }

    location = /pimory/ {
        return 308 /pimory$is_args$args;
    }

    location @pimory_login {
        add_header Cache-Control "private, no-store" always;
        return 302 /login?redirect=%2Fpimory;
    }

    # Valid catalogue IDs/gallery names contain no query delimiters. Build the
    # encoded login return path before auth subrequests can change captures.
    location ~ "^/catalogue/public/(?<catalogue_route>[A-Za-z0-9-]+)/?$" {
        set $catalogue_login_redirect /login?redirect=%2Fcatalogue%2Fpublic%2F$catalogue_route;
        auth_request /_private_ui_auth;
        add_header X-Ui-Audit $ui_audit always;
        error_page 401 = @catalogue_login;
        error_page 403 = @private_ui_denied;
        error_page 500 502 503 504 = @private_ui_unavailable;
        add_header Cache-Control "private, no-store" always;
        add_header Vary Cookie always;
        try_files /index.html =404;
    }

    location @catalogue_login {
        add_header Cache-Control "private, no-store" always;
        return 302 $catalogue_login_redirect;
    }

    location @private_ui_unavailable {
        add_header Cache-Control "private, no-store" always;
        default_type text/plain;
        return 503 "Service temporarily unavailable. Please try again later.";
    }

    # ^~ takes priority over the public immutable-asset regex below.
    # Even a known filename requires a live server-validated session.
    location ^~ /protected/ {
        auth_request /_private_ui_auth;
        add_header X-Ui-Audit $ui_audit always;
        error_page 403 = @private_ui_denied;
        error_page 500 502 503 504 = @private_ui_unavailable;
        add_header Cache-Control "private, no-store" always;
        add_header Vary Cookie always;
        try_files $uri =404;
    }

    location ^~ /.security/ { return 404; }
    location ^~ /.vite/ { return 404; }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|mp3|wav)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
